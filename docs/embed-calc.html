    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="title" content="Combined US Income Tax Estimator" />
        <link href="html_inc/common.css" rel="stylesheet" type="text/css" />

        <title>Combined US Income Tax Estimator</title>
        <script src="html_inc/useUmamiAnalytics.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const loadingInfoDiv = document.getElementById("loading-info");
                const iframe = document.getElementById("embedded-calc-iframe");

                // Show initial loading message when iframe starts loading
                loadingInfoDiv.textContent = "Initializing Excel document frame (takes up to a minute)...";
                loadingInfoDiv.style.margin = "5px";
                loadingInfoDiv.style.padding = "5px";

                // When iframe loads
                iframe.addEventListener("load", function () {
                    loadingInfoDiv.textContent = "Excel document frame initialized. Calculator may take another minute to load.";

                    // Start timer
                    setTimeout(function () {
                        loadingInfoDiv.textContent =
                            "If calculator is still loading, give it another 30 secs and refresh the page. Otherwise, ignore this message.";

                        // After delay, clear the message
                        setTimeout(function () {
                            loadingInfoDiv.textContent = "";
                            loadingInfoDiv.style.margin = "0";
                            loadingInfoDiv.style.padding = "0";
                        }, 15000);
                    }, 5000);
                });
            });
        </script>
    </head>

                </div>
