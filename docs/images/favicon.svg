<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#217346"/>
      <stop offset="100%" style="stop-color:#185c37"/>
    </linearGradient>
  </defs>

  <!-- Excel-green background -->
  <rect width="32" height="32" rx="5" fill="url(#bg)"/>

  <!-- $ left, larger, bright white -->
  <text x="9" y="22"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="900"
        fill="#ffffff"
        text-anchor="middle">$</text>

  <!-- % right, smaller, light green tint -->
  <text x="23" y="20"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="900"
        fill="#a9d6b8"
        text-anchor="middle">%</text>

  <!-- Thin diagonal divider between them -->
  <line x1="16.5" y1="7" x2="14.5" y2="25" stroke="#ffffff40" stroke-width="1.2"/>
</svg>
